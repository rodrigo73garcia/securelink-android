[package]
name = "blocklist-builder"
version = "0.1.0"
edition = "2021"
description = "Builds Bloom filter from multiple blocklist sources for SecureLink"

[[bin]]
name = "blocklist-builder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bloomfilter = "0.8"
base64 = { version = "0.22", features = ["serde"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
csv = "1.3"
walkdir = "2"