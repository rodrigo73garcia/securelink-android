name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  # ============================================
  # ANDROID APP - Build APK puro Kotlin (sem Rust nativo)
  # ============================================
  android-build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: securelink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: securelink-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  # ============================================
  # RELEASE - Cria release no GitHub com APK anexado
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Debug APK (sempre anexa o debug como alternativa)
        uses: actions/download-artifact@v4
        with:
          name: securelink-debug-apk
          path: ./release

      - name: Generate changelog
        run: |
          cat > CHANGELOG.md << 'EOF'
          # SecureLink ${{ github.ref_name }}

          ## 📱 Download do APK
          Baixe o arquivo **app-debug.apk** abaixo nesta página de Release.

          ## ✨ O que o app faz
          - Intercepta links clicados no WhatsApp, Telegram, SMS, Email
          - Detecta homógrafos (ex: аpple.com com 'а' cirílico)
          - Detecta typosquatting (ex: cacaushowbr.com imitando cacaushow.com.br)
          - 60+ marcas brasileiras protegidas (bancos, lojas, governo)
          - Lista offline de 1M+ domínios de phishing
          - Veredito em português: 🟢 Seguro / 🟡 Suspeito / 🔴 Bloqueado

          ## 🔧 Como instalar
          1. Baixe o arquivo app-debug.apk nesta página
          2. No celular: Configurações → Segurança → Permitir apps de fontes desconhecidas
          3. Abra o APK baixado e instale
          4. Abra o app SecureLink → toque em "Definir como navegador padrão"
          5. Pronto! Links de WhatsApp/Telegram agora passam pela verificação

          ## 🧪 Teste
          Clique neste link de teste: https://cacaushowbr.com (deve aparecer 🔴 BLOQUEADO)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-debug.apk
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
