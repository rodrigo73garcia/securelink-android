name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_SDK_ROOT: /opt/android-sdk
  NDK_VERSION: 26.1.10909125

jobs:
  # ============================================
  # RUST CORE - Testes e build para targets Linux
  # ============================================
  rust-core:
    name: Rust Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust core (Linux)
        working-directory: ./core
        run: cargo build --release

      - name: Run tests
        working-directory: ./core
        run: cargo test --release

      - name: Upload Linux library
        uses: actions/upload-artifact@v4
        with:
          name: libsecurelink_core-linux
          path: core/target/release/libsecurelink_core.so
          retention-days: 7

  # ============================================
  # RUST CORE ANDROID - Build para targets Android
  # ============================================
  rust-core-android:
    name: Rust Core (Android ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Configure Android NDK linker
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" >> $GITHUB_ENV

      - name: Build Rust core for Android
        working-directory: ./core
        run: cargo build --target ${{ matrix.target }} --release --features android

      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: libsecurelink_core-android-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/libsecurelink_core.so
          retention-days: 7

  # ============================================
  # ANDROID APP - Build e testes
  # ============================================
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [rust-core, rust-core-android]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux library
        uses: actions/download-artifact@v4
        with:
          name: libsecurelink_core-linux
          path: core/target/release

      - name: Download Android libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libsecurelink_core-android-*
          path: android/app/src/main/jniLibs
          merge-multiple: true

      - name: Organize jniLibs
        run: |
          cd android/app/src/main/jniLibs
          for dir in libsecurelink_core-android-*; do
            if [ -d "$dir" ]; then
              target=$(echo $dir | sed 's/libsecurelink_core-android-//')
              mkdir -p "$target"
              mv "$dir"/libsecurelink_core.so "$target"/ 2>/dev/null || true
            fi
          done
          ls -la */

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          cmdline-tools-version: 'latest'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: securelink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: securelink-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  # ============================================
  # BLOCKLIST BUILDER - Gera Bloom filter (manual only)
  # ============================================
  blocklist-builder:
    name: Build Blocklist
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            blocklist-builder/target
          key: ${{ runner.os }}-blocklist-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build blocklist builder
        working-directory: ./blocklist-builder
        run: cargo build --release

      - name: Download blocklist sources
        run: |
          mkdir -p blocklists
          curl -sL "https://raw.githubusercontent.com/oisd/domains/main/domains.txt" -o blocklists/oisd.txt
          curl -sL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/phishing.txt" -o blocklists/hagezi-phishing.txt
          curl -sL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/nrd.txt" -o blocklists/hagezi-nrd.txt
          curl -sL "https://urlhaus.abuse.ch/downloads/hostfile/" -o blocklists/urlhaus.txt
          curl -sL "https://phishstats.info/phish_score.csv" -o blocklists/phishstats.csv
          curl -sL "https://openphish.com/feed.txt" -o blocklists/openphish.txt
          
          if [ -f blocklists/phishstats.csv ]; then
            tail -n +2 blocklists/phishstats.csv | cut -d',' -f2 | sort -u > blocklists/phishstats.txt
          fi

      - name: Generate Bloom filter
        run: |
          ./blocklist-builder/target/release/blocklist-builder \
            --inputs blocklists/*.txt \
            --output blocklist.bloom \
            --version $(date +%s)

      - name: Upload Bloom filter
        uses: actions/upload-artifact@v4
        with:
          name: blocklist-bloom
          path: blocklist.bloom
          retention-days: 7

  # ============================================
  # RELEASE - Cria release no GitHub
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: securelink-release-apk
          path: ./release

      - name: Generate changelog
        run: |
          cat > CHANGELOG.md << 'EOF'
          # SecureLink ${{ github.ref_name }}
          
          ## 📱 Download
          - [app-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk) (universal ARM64/ARMv7/x86/x86_64)
          
          ## ✨ Funcionalidades
          - Intercepta links no WhatsApp, Telegram, SMS, Email
          - Detecta homógrafos (cirílico/grego), typosquatting, combosquatting
          - 60+ marcas brasileiras monitoradas
          - Blocklist offline (1M+ domínios)
          - RDAP para idade do domínio
          
          ## 🔧 Instalação
          1. Baixe o APK acima
          2. Instale no Android (permita 'Instalar apps desconhecidos')
          3. Abra o app → 'Definir como navegador padrão'
          4. Teste clicando em: https://cacaushowbr.com (deve bloquear 🔴)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}